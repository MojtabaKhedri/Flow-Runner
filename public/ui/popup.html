<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Flow Runner</title>
  <link rel="preload" href="../fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="typography.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="masthead"><img src="../icons/mark.svg" alt="" width="36" height="36"><span class="wordmark" dir="ltr">Flow Runner</span></header>
    <section class="control" aria-labelledby="enabled-label">
      <button id="toggle" class="toggle" type="button" role="switch" aria-checked="false" aria-label="فعال‌سازی افزونه" disabled><span class="power-disc"><svg viewBox="0 0 48 48" width="44" height="44" fill="none" aria-hidden="true" focusable="false"><path d="M24 7v17M14 14a17 17 0 1 0 20 0" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg></span></button>
      <h2 id="enabled-label" aria-live="polite">افزونه خاموش است</h2>
    </section>
    <div class="actions"><button id="open" class="primary" type="button"><span class="primary-arrow" aria-hidden="true">↗</span><span>بازکردن گوگل فلو</span></button><button id="refresh" class="secondary" type="button" hidden>بارگذاری دوباره صفحه</button></div>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
    <p id="error" class="error" role="alert"></p>
    <footer><button id="help" type="button">راهنما</button><span aria-hidden="true">·</span><button id="privacy" type="button">حریم خصوصی</button><span aria-hidden="true">·</span><a id="source" href="https://github.com/MojtabaKhedri/Flow-Runner" target="_blank" rel="noopener noreferrer">سورس کد</a><span aria-hidden="true">·</span><a id="creator" href="https://t.me/PershaStore" target="_blank" rel="noopener noreferrer" title="کانال تلگرام PershaStore">سازنده</a></footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
